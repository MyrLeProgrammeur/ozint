[package]
name = "ozint-server"
description = "The OZINT HTTP server: /api/ozint/* plus the kill switch, and it serves the web cockpit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ozint-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["macros", "json", "multipart"] }
bytes = "1.12.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures = "0.3.33"
ozint = { version = "0.1.0", path = "../ozint" }
ozint-core = { version = "0.1.0", path = "../ozint-core" }
ozint-db = { version = "0.1.0", path = "../ozint-db" }
ozint-llm = { version = "0.1.0", path = "../ozint-llm" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "gzip", "charset", "http2"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "cors", "compression-gzip", "trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.19.1", features = ["v4"] }
