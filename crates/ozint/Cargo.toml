[package]
name = "ozint"
description = "The OZINT investigation engine: entity classification, layered OSINT fan-out, provenance and dossiers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.9"
futures = "0.3.33"
idna = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
image_hasher = "3.1.1"
infer = "0.19"
ozint-llm = { version = "0.1.0", path = "../ozint-llm" }
ozint-core = { version = "0.1.0", path = "../ozint-core" }
ozint-db = { version = "0.1.0", path = "../ozint-db" }
kamadak-exif = "0.6.1"
maxminddb = "0.30.3"
md-5 = "0.10"
phonenumber = "0.3.7"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "gzip", "charset", "http2", "form"] }
rqrr = "0.10.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4.46"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.19.1", features = ["v4", "serde"] }

[dev-dependencies]
# `test-util` enables `tokio::time::pause()`, which auto-advances the timer whenever the
# runtime goes idle. `runtime.rs`'s scheduler tests need it: `SCHEDULER_MAX_WAIT` is 45
# seconds of real waiting, and a test that exhausts a quota would otherwise sit through all
# of it — turning a 0.5s suite into a 45s one. Not enabled by tokio's `full` feature.
tokio = { version = "1.53.1", features = ["full", "test-util"] }
