[package]
name = "ozint-core"
description = "Shared configuration, errors, HTTP pool, SSRF guard and kill switch for OZINT."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "gzip", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1.44"
unicode-normalization = "0.1.25"
url = "2.5.8"
